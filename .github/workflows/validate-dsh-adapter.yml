name: Validate DSH Adapter

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test adapter
        run: npm test
      - name: Verify package contents
        run: npm run pack:check
