<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capability Value Test</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --ink: #152033;
      --muted: #5c687a;
      --line: #dce2ea;
      --baseline: #2563eb;
      --candidate: #059669;
      --warning: #b45309;
      --danger: #b91c1c;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    a { color: #1d4ed8; }
    .page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 72px; }
    .hero, .section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .hero { padding: 34px; overflow: visible; position: relative; }
    .hero::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      right: -100px;
      top: -150px;
      background: radial-gradient(circle, rgba(5,150,105,.22), rgba(37,99,235,.04) 70%);
      pointer-events: none;
    }
    .language-picker { position: absolute; z-index: 3; top: 24px; right: 24px; }
    .language-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 144px;
      justify-content: space-between;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.96);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(15,23,42,.08);
    }
    .language-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 190px;
      max-height: 280px;
      overflow: auto;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .language-menu[hidden] { display: none; }
    .language-option {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 9px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: start;
      cursor: pointer;
    }
    .language-option:hover, .language-option[aria-current="true"] { background: var(--surface-2); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 850px; margin: 0 0 12px; padding-right: 120px; font-size: clamp(30px, 5vw, 52px); line-height: 1.08; }
    h2 { margin-bottom: 8px; font-size: 25px; }
    h3 { margin-bottom: 6px; font-size: 18px; }
    .lede { max-width: 850px; color: var(--muted); font-size: 17px; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 20px; color: var(--muted); font-size: 14px; }
    .verdict {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 800;
      background: #dcfce7;
      color: #166534;
    }
    .verdict[data-status="do_not_adopt"] { background: #fee2e2; color: #991b1b; }
    .verdict[data-status="inconclusive"] { background: #e2e8f0; color: #334155; }
    .section { margin-top: 22px; padding: 26px; }
    .section-head { margin-bottom: 20px; }
    .section-head p { margin: 0; color: var(--muted); }
    .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .metric { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(180deg, #fff, #f8fafc); }
    .metric-label { color: var(--muted); font-size: 13px; font-weight: 800; }
    .metric-values { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .metric-value { min-width: 0; }
    .metric-value span { display: block; overflow-wrap: anywhere; }
    .metric-value .method { color: var(--muted); font-size: 12px; }
    .metric-value .number { margin-top: 2px; font-size: 18px; font-weight: 850; }
    .delta { margin-top: 12px; color: var(--muted); font-size: 12px; }
    .delta.good { color: #047857; font-weight: 800; }
    .delta.bad { color: var(--danger); font-weight: 800; }
    .subsection { margin-top: 28px; padding-top: 26px; border-top: 1px solid var(--line); }
    .subsection-title { margin-bottom: 12px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
    table { width: 100%; min-width: 760px; border-collapse: collapse; }
    th, td { padding: 13px 15px; text-align: start; vertical-align: top; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); background: #f8fafc; font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .arm { border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
    .arm.baseline { border-top: 5px solid var(--baseline); }
    .arm.candidate { border-top: 5px solid var(--candidate); }
    .arm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .arm-sub { color: var(--muted); font-size: 13px; }
    .badge { padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 850; white-space: nowrap; }
    .badge.verified { background: #dcfce7; color: #166534; }
    .badge.unverified { background: #fee2e2; color: #991b1b; }
    .timeline { position: relative; margin: 20px 0 0 8px; padding-left: 22px; border-left: 2px solid var(--line); }
    .step { position: relative; padding: 0 0 18px; }
    .step:last-child { padding-bottom: 0; }
    .step::before { content: ""; position: absolute; left: -29px; top: 6px; width: 12px; height: 12px; border: 3px solid var(--surface); border-radius: 50%; background: var(--baseline); box-shadow: 0 0 0 1px var(--line); }
    .candidate .step::before { background: var(--candidate); }
    .step-time { color: var(--muted); font-size: 12px; }
    .step-title { font-weight: 800; }
    .step-detail { color: var(--muted); font-size: 14px; }
    .result-box { margin-top: 20px; padding: 16px; border-radius: 12px; background: var(--surface-2); }
    .process-round { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; background: #fbfcff; }
    .process-round > summary { padding: 15px 17px; cursor: pointer; font-weight: 800; }
    .process-round > .compare { padding: 0 16px 16px; }
    .step-evidence { margin-top: 8px; border: 1px solid var(--line); border-radius: 9px; background: #f8fafc; }
    .step-evidence summary { padding: 7px 10px; cursor: pointer; color: #1d4ed8; font-size: 12px; font-weight: 750; }
    .step-evidence pre { margin: 0; padding: 11px; overflow: auto; border-radius: 0 0 8px 8px; color: #dbeafe; background: #0f172a; white-space: pre-wrap; overflow-wrap: anywhere; }
    .design-grid { display: grid; gap: 12px; }
    .design-card { padding: 17px; border: 1px solid var(--line); border-radius: 13px; }
    .bars { margin-top: 18px; display: grid; gap: 13px; }
    .bar-row { display: grid; grid-template-columns: minmax(110px, 180px) 1fr 90px; gap: 12px; align-items: center; }
    .bar-track { height: 14px; overflow: hidden; border-radius: 999px; background: var(--surface-2); }
    .bar-fill { height: 100%; min-width: 3px; border-radius: inherit; background: var(--baseline); }
    .bar-fill.candidate { background: var(--candidate); }
    .bar-number { text-align: right; font-variant-numeric: tabular-nums; }
    .analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .analysis-card { padding: 18px; border: 1px solid var(--line); border-radius: 14px; }
    .analysis-card ul { margin: 8px 0 0; padding-left: 20px; }
    .research-summary { margin-bottom: 14px; color: var(--muted); }
    .source-list { display: grid; gap: 12px; }
    .source-card { padding: 15px; border: 1px solid var(--line); border-radius: 12px; background: #f8fafc; }
    .source-meta { color: var(--muted); font-size: 12px; }
    .scenario-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .scenario-card { padding: 18px; border: 1px solid var(--line); border-radius: 14px; }
    .scenario-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .scenario-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .scenario-badge { padding: 4px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 800; }
    .scenario-badge.use { background: #dcfce7; color: #166534; }
    .scenario-badge.avoid { background: #fee2e2; color: #991b1b; }
    .scenario-badge.retest { background: #fef3c7; color: #92400e; }
    .scenario-line { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .scenario-line strong { color: var(--ink); }
    .recommendation { margin-top: 18px; padding: 18px; border-radius: 14px; background: #ecfdf5; border: 1px solid #a7f3d0; }
    .limitation { margin-top: 14px; padding: 16px; border-radius: 12px; background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; }
    .evidence-body { padding: 0 14px 14px; }
    .evidence-body pre { margin: 8px 0 0; padding: 13px; overflow: auto; border-radius: 8px; color: #dbeafe; background: #080f1d; white-space: pre-wrap; overflow-wrap: anywhere; }
    .evidence-body img { display: block; max-width: 100%; margin-top: 12px; border-radius: 8px; border: 1px solid #31405a; }
    .attachment-error { color: #fbbf24; font-size: 13px; }
    footer { padding: 24px 4px 0; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 900px) {
      .metric-grid { grid-template-columns: 1fr 1fr; }
      .compare, .analysis-grid, .scenario-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .page { width: min(100% - 18px, 1180px); padding-top: 10px; }
      .hero, .section { padding: 19px; border-radius: 14px; }
      .language-picker { position: relative; top: auto; right: auto; display: flex; justify-content: flex-end; margin-bottom: 18px; }
      .language-menu { top: calc(100% + 8px); }
      h1 { padding-right: 0; }
      .metric-grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr; gap: 4px; }
      .bar-number { text-align: left; }
    }
  </style>
</head>
<body data-report-format-version="__REPORT_FORMAT_VERSION__">
  <main class="page">
    <section class="hero">
      <div class="language-picker">
        <button class="language-button" id="language-button" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span>🌐 <span id="current-language"></span></span><span>▾</span>
        </button>
        <div class="language-menu" id="language-menu" role="listbox" hidden></div>
      </div>
      <h1 id="title"></h1>
      <p class="lede" id="verdict-summary"></p>
      <div class="verdict" id="verdict"></div>
      <div class="meta">
        <span><strong id="task-label"></strong><span id="task"></span></span>
        <span><strong id="question-label"></strong><span id="question"></span></span>
        <span><strong id="tested-label"></strong><span id="tested-at"></span></span>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 id="comparison-title"></h2><p id="comparison-note"></p></div>
      <div class="metric-grid" id="metrics"></div>
      <div class="bars" id="time-bars"></div>
      <div class="subsection">
        <h3 class="subsection-title" id="round-results-title"></h3>
        <div class="table-wrap" id="round-results"></div>
      </div>
      <div class="subsection">
        <h3 class="subsection-title" id="experiment-findings-title"></h3>
        <div class="analysis-card"><ul id="experiment-findings"></ul></div>
      </div>
      <div class="subsection">
        <h3 class="subsection-title" id="research-title"></h3>
        <p class="research-summary" id="research-summary"></p>
        <div class="source-list" id="research-sources"></div>
      </div>
      <div class="subsection">
        <h3 class="subsection-title" id="analysis-title"></h3>
        <div class="analysis-grid">
          <div class="analysis-card"><h3 id="benefits-title"></h3><ul id="benefits"></ul></div>
          <div class="analysis-card"><h3 id="tradeoffs-title"></h3><ul id="tradeoffs"></ul></div>
        </div>
        <h3 id="scenarios-title" style="margin-top:22px"></h3>
        <div class="scenario-grid" id="scenarios"></div>
        <div class="recommendation"><strong id="recommendation-title"></strong><p id="recommendation"></p></div>
        <div class="limitation"><strong id="limitation-title"></strong><div id="limitation"></div></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 id="design-title"></h2><p id="design-note"></p></div>
      <div class="design-grid" id="design-grid"></div>
      <div class="subsection">
        <h3 class="subsection-title" id="process-title"></h3>
        <p class="research-summary" id="process-note"></p>
        <div id="process-rounds"></div>
      </div>
    </section>

    <footer id="footer"></footer>
  </main>

        design: "2. 실험 설계와 증거", designNote: "실험 설계 이유를 확인하고 각 회차를 펼쳐 실행 과정과 호출 증거를 검증할 수 있습니다.", designBasis: "설계 근거", fairness: "공정 조건", judgmentRule: "판단 기준",
        process: "실행 과정 비교", processNote: "타임라인은 기록된 주요 이벤트만 보여 주는 실행 기록이며 실시간 영상이 아닙니다.", viewEvidence: "증거 보기", additionalEvidence: "추가 증거",
        baseline: "기존 방식", candidate: "새 기능 방식", verified: "검증됨", unverified: "검증 안 됨", result: "결과",
        experimentFindings: "실험에서 직접 관찰한 내용",
        research: "외부 조사와 출처", noSources: "신뢰할 수 있는 외부 자료를 확보하지 못했습니다.",
        sourceFinding: "이 출처가 뒷받침하는 내용", analysis: "종합 분석과 사용 제안",
        benefits: "주요 장점", tradeoffs: "주요 단점과 비용", scenarios: "구체적인 사용 상황", recommendation: "도입 제안", limitation: "주요 한계",
        audience: "사용자", scenarioTask: "구체적 작업", environment: "환경", reason: "이유", basis: "근거", confidence: "신뢰도", sources: "출처",
        use: "사용", avoid: "사용하지 않음", retest: "추가 테스트", experiment: "실험", researchBasis: "외부 조사", combined: "실험과 조사", high: "높음", medium: "중간", low: "낮음",
        evidenceFile: "증거 파일", footer: "capability-value-test가 로컬에서 생성했습니다. 외부 스크립트나 글꼴을 불러오지 않습니다."
      }
    };

    function node(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined && text !== null) element.textContent = String(text);
      return element;
    }
    function isObject(value) { return value && typeof value === "object" && !Array.isArray(value); }
    function mergeLocalized(base, overlay) {
      if (overlay === undefined) return base;
      if (Array.isArray(base) && Array.isArray(overlay)) {
        if (base.every(isObject) && overlay.every(isObject)) {
          return base.map((item, index) => overlay[index] ? mergeLocalized(item, overlay[index]) : item);
        }
        return overlay;
      }
      if (isObject(base) && isObject(overlay)) {
        const result = { ...base };
        Object.keys(overlay).forEach((key) => { result[key] = mergeLocalized(base[key], overlay[key]); });
        return result;
      }
      return overlay;
    }
    function clear(id) { $(id).replaceChildren(); }

    const localeEntries = baseData.i18n.locales;
    let currentLocale = baseData.i18n.default_locale;
    let data;
    let copy;

    function currentContent() {
      const localized = localeEntries[currentLocale].content || {};
      return mergeLocalized(JSON.parse(JSON.stringify(baseData)), localized);
    }
    function formatNumber(value, digits = 1) {
      return Number(value).toLocaleString(currentLocale, { maximumFractionDigits: digits });
    }
    function formatSeconds(value) { return `${formatNumber(value, 2)} s`; }
    function formatCost(arm) {
      if (arm.cost === null || arm.cost === undefined) return copy.missing;
      return `${arm.cost_currency || ""} ${formatNumber(arm.cost, 4)}`.trim();
    }
    function percentText(value, noun) {
      if (value === null || value === undefined) return copy.missing;
      if (Math.abs(value) < 0.05) return `${noun}: ${copy.noChange}`;
      return value > 0 ? `${noun}: ${formatNumber(value)}% ${copy.lower}` : `${noun}: ${formatNumber(Math.abs(value))}% ${copy.higher}`;
    }
    function addMetric(label, baselineValue, candidateValue, deltaText, deltaClass = "") {
      const card = node("div", "metric");
      card.append(node("div", "metric-label", label));
      const values = node("div", "metric-values");
      [[data.baseline.name, baselineValue], [data.candidate.name, candidateValue]].forEach(([method, value]) => {
        const box = node("div", "metric-value");
        box.append(node("span", "method", method), node("span", "number", value));
        values.append(box);
      });
      card.append(values, node("div", `delta ${deltaClass}`.trim(), deltaText));
      $("metrics").append(card);
    }
    function renderMetrics() {
      addMetric(copy.quality, data.baseline.quality.label, data.candidate.quality.label, data.candidate.quality.summary);
      const timePct = data.computed.time_improvement_percent;
      addMetric(copy.time, formatSeconds(data.baseline.elapsed_seconds), formatSeconds(data.candidate.elapsed_seconds), percentText(timePct, copy.candidateTime), timePct > 0 ? "good" : timePct < 0 ? "bad" : "");
      const tokenPct = data.computed.token_improvement_percent;
      addMetric(copy.tokens, data.baseline.tokens ?? copy.missing, data.candidate.tokens ?? copy.missing, percentText(tokenPct, copy.candidateTokens), tokenPct > 0 ? "good" : tokenPct < 0 ? "bad" : "");
      const costPct = data.computed.cost_improvement_percent;
      addMetric(copy.cost, formatCost(data.baseline), formatCost(data.candidate), percentText(costPct, copy.candidateCost), costPct > 0 ? "good" : costPct < 0 ? "bad" : "");
      const maxTime = Math.max(data.baseline.elapsed_seconds, data.candidate.elapsed_seconds, 0.001);
      [[data.baseline, "baseline"], [data.candidate, "candidate"]].forEach(([arm, kind]) => {
        const row = node("div", "bar-row");
        row.append(node("div", "", arm.name));
        const track = node("div", "bar-track");
        const fill = node("div", `bar-fill ${kind === "candidate" ? "candidate" : ""}`.trim());
        fill.style.width = `${Math.max(2, arm.elapsed_seconds / maxTime * 100)}%`;
        track.append(fill);
        row.append(track, node("div", "bar-number", formatSeconds(arm.elapsed_seconds)));
        $("time-bars").append(row);
      });
    }
    function armHeading(arm, title) {
      const head = node("div", "arm-head");
      const text = node("div");
      text.append(node("h3", "", title), node("div", "arm-sub", `${arm.name}${arm.version ? ` · ${arm.version}` : ""}`));
      head.append(text, node("span", `badge ${arm.verified ? "verified" : "unverified"}`, arm.verified ? copy.verified : copy.unverified));
      return head;
    }
    function evidenceDetails(item) {
      const details = node("details", "step-evidence");
      details.append(node("summary", "", `${copy.viewEvidence} · ${item.label}`));
      const body = node("div", "evidence-body");
      if (item.content) body.append(node("pre", "", item.content));
      if (item.data_url) { const image = node("img"); image.src = item.data_url; image.alt = item.label; body.append(image); }
      else if (item.path) body.append(node("div", "arm-sub", `${copy.evidenceFile}: ${item.path}`));
      if (item.attachment_error) body.append(node("div", "attachment-error", item.attachment_error));
      details.append(body);
      return details;
    }
    function renderArmProcess(arm, title, kind) {
      const target = node("article", `arm ${kind}`);
      target.append(armHeading(arm, title));
      const timeline = node("div", "timeline");
      arm.steps.forEach((item) => {
        const step = node("div", "step");
        if (item.time) step.append(node("div", "step-time", item.time));
        step.append(node("div", "step-title", item.title), node("div", "step-detail", item.detail));
        (item.evidence || []).forEach((evidence) => step.append(evidenceDetails(evidence)));
        timeline.append(step);
      });
      const result = node("div", "result-box");
      result.append(node("strong", "", copy.result), node("div", "", arm.result_summary));
      target.append(timeline, result);
      if (arm.evidence && arm.evidence.length) {
        const extra = node("details", "step-evidence");
        extra.append(node("summary", "", copy.additionalEvidence));
        const body = node("div", "evidence-body");
        arm.evidence.forEach((item) => body.append(evidenceDetails(item)));
        extra.append(body); target.append(extra);
      }
      return target;
    }
    function roundDifference(round) {
      const delta = round.baseline.elapsed_seconds - round.candidate.elapsed_seconds;
      if (Math.abs(delta) < 0.01) return copy.noChange;
      return delta > 0
        ? `${data.candidate.name}: ${formatSeconds(delta)} ${copy.lower}`
        : `${data.candidate.name}: ${formatSeconds(Math.abs(delta))} ${copy.higher}`;
    }
    function renderRoundTable() {
      const table = node("table");
      const head = node("thead");
      const headRow = node("tr");
      [copy.round, copy.taskSample, copy.originalResult, copy.newResult, copy.keyDifference].forEach((label) => headRow.append(node("th", "", label)));
      head.append(headRow); table.append(head);
      const body = node("tbody");
      data.rounds.forEach((round, index) => {
        const row = node("tr");
        row.append(node("td", "", String(index + 1)), node("td", "", round.task));
        row.append(node("td", "", `${round.baseline.quality.label} · ${formatSeconds(round.baseline.elapsed_seconds)}`));
        row.append(node("td", "", `${round.candidate.quality.label} · ${formatSeconds(round.candidate.elapsed_seconds)}`));
        row.append(node("td", "", roundDifference(round)));
        body.append(row);
      });
      table.append(body); $("round-results").append(table);
    }
    function renderRounds() {
      data.rounds.forEach((round, index) => {
        const details = node("details", "process-round");
        if (index === 0) details.open = true;
        details.append(node("summary", "", `${index + 1}. ${round.title}`));
        const compare = node("div", "compare");
        compare.append(renderArmProcess(round.baseline, copy.baseline, "baseline"), renderArmProcess(round.candidate, copy.candidate, "candidate"));
        details.append(compare); $("process-rounds").append(details);
      });
    }
    function renderDesign() {
      [[copy.designBasis, data.design.basis], [copy.fairness, data.design.fairness], [copy.judgmentRule, data.design.judgment_rule]].forEach(([label, value]) => {
        const card = node("div", "design-card"); card.append(node("h3", "", label), node("p", "", value)); $("design-grid").append(card);
      });
    }
    function renderList(targetId, items) {
      const target = $(targetId);
      (items || []).forEach((item) => target.append(node("li", "", item)));
      if (!items || items.length === 0) target.append(node("li", "", copy.missing));
    }
    function renderResearch() {
      $("research-summary").textContent = data.analysis.research.summary;
      const target = $("research-sources");
      const sources = data.analysis.research.sources || [];
      if (!sources.length) { target.append(node("div", "source-card", copy.noSources)); return; }
      sources.forEach((source) => {
        const card = node("article", "source-card");
        const link = node("a", "", source.title);
        link.href = source.url; link.target = "_blank"; link.rel = "noreferrer";
        card.append(link, node("div", "source-meta", source.publisher));
        const finding = node("p", "");
        finding.append(node("strong", "", `${copy.sourceFinding}: `), document.createTextNode(source.finding));
        card.append(finding);
        target.append(card);
      });
    }
    function renderScenarios() {
      const sourceMap = Object.fromEntries((data.analysis.research.sources || []).map((source) => [source.id, source]));
      data.analysis.scenarios.forEach((scenario) => {
        const card = node("article", "scenario-card");
        const top = node("div", "scenario-top");
        top.append(node("h3", "", scenario.title), node("span", `scenario-badge ${scenario.recommendation}`, copy[scenario.recommendation]));
        card.append(top);
        const badges = node("div", "scenario-badges");
        badges.append(node("span", "scenario-badge", `${copy.basis}: ${scenario.basis === "research" ? copy.researchBasis : copy[scenario.basis]}`));
        badges.append(node("span", "scenario-badge", `${copy.confidence}: ${copy[scenario.confidence]}`));
        card.append(badges);
        [[copy.audience, scenario.audience], [copy.scenarioTask, scenario.task], [copy.environment, scenario.environment], [copy.reason, scenario.reason]].forEach(([label, value]) => {
          const line = node("div", "scenario-line"); line.append(node("strong", "", `${label}: `), document.createTextNode(value)); card.append(line);
        });
        const refs = (scenario.source_refs || []).map((id) => sourceMap[id]).filter(Boolean);
        if (refs.length) {
          const line = node("div", "scenario-line"); line.append(node("strong", "", `${copy.sources}: `));
          refs.forEach((source, index) => { if (index) line.append(document.createTextNode(" · ")); const link = node("a", "", source.title); link.href = source.url; link.target = "_blank"; link.rel = "noreferrer"; line.append(link); });
          card.append(line);
        }
        $("scenarios").append(card);
      });
    }
    function setStaticText() {
      const mapping = {
        "task-label": "task", "question-label": "question", "tested-label": "tested",
        "comparison-title": "comparison", "comparison-note": "comparisonNote", "round-results-title": "roundResults",
        "experiment-findings-title": "experimentFindings", "research-title": "research", "analysis-title": "analysis",
        "benefits-title": "benefits", "tradeoffs-title": "tradeoffs", "scenarios-title": "scenarios",
        "recommendation-title": "recommendation", "limitation-title": "limitation", "design-title": "design", "design-note": "designNote",
        "process-title": "process", "process-note": "processNote", footer: "footer"
      };
      Object.entries(mapping).forEach(([id, key]) => { $(id).textContent = copy[key]; });
    }
    function renderReport() {
      data = currentContent();
      copy = UI[currentLocale] || UI.en;
      document.documentElement.lang = currentLocale;
      document.documentElement.dir = localeEntries[currentLocale].direction || "ltr";
      document.title = data.title;
      setStaticText();
      $("current-language").textContent = localeEntries[currentLocale].label;
      $("title").textContent = data.title;
      $("verdict-summary").textContent = data.verdict.summary;
      $("verdict").textContent = data.verdict.label;
      $("verdict").dataset.status = data.verdict.status;
      $("task").textContent = data.task;
      $("question").textContent = data.primary_question;
      $("tested-at").textContent = data.tested_at;
      $("recommendation").textContent = data.analysis.recommendation;
      $("limitation").textContent = data.verdict.limitation;
      ["metrics", "time-bars", "round-results", "experiment-findings", "research-sources", "benefits", "tradeoffs", "scenarios", "design-grid", "process-rounds"].forEach(clear);
      renderMetrics();
      renderRoundTable();
      renderList("experiment-findings", data.analysis.experiment_findings);
      renderResearch();
      renderList("benefits", data.analysis.benefits);
      renderList("tradeoffs", data.analysis.tradeoffs);
      renderScenarios();
      renderDesign();
      renderRounds();
      renderLanguageMenu();
    }
    function renderLanguageMenu() {
      const menu = $("language-menu"); menu.replaceChildren();
      Object.entries(localeEntries).forEach(([code, locale]) => {
        const option = node("button", "language-option"); option.type = "button"; option.setAttribute("role", "option"); option.setAttribute("aria-current", String(code === currentLocale));
        option.append(node("span", "", locale.label), node("span", "", code === currentLocale ? "✓" : ""));
        option.addEventListener("click", () => { currentLocale = code; closeLanguageMenu(); renderReport(); });
        menu.append(option);
      });
    }
    function closeLanguageMenu() { $("language-menu").hidden = true; $("language-button").setAttribute("aria-expanded", "false"); }
    $("language-button").addEventListener("click", (event) => { event.stopPropagation(); const menu = $("language-menu"); menu.hidden = !menu.hidden; $("language-button").setAttribute("aria-expanded", String(!menu.hidden)); });
    document.addEventListener("click", closeLanguageMenu);
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeLanguageMenu(); });
    renderReport();
  </script>
</body>
</html>
